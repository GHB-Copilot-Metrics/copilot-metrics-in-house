<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copilot Metrics Dashboard</title>
  <meta name="description" content="Fetch and export GitHub Copilot enterprise metrics for any date range." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Animated background particles -->
  <div class="bg-particles" aria-hidden="true">
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
  </div>

  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div>
          <h1>Copilot Metrics Dashboard</h1>
          <p class="subtitle">GitHub Enterprise · BALICteam</p>
        </div>
      </div>
    </header>

    <!-- Controls Card -->
    <section class="glass-card controls-card" id="controls-section">
      <h2 class="card-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Select Date Range
      </h2>
      <form id="metrics-form" class="controls-form">
        <div class="input-group">
          <label for="start-date">Start Date</label>
          <input type="date" id="start-date" required />
        </div>
        <div class="input-group">
          <label for="end-date">End Date</label>
          <input type="date" id="end-date" required />
        </div>
        <button type="submit" id="fetch-btn" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          <span>Fetch Metrics</span>
        </button>
      </form>
    </section>

    <!-- Progress Bar -->
    <div class="progress-container hidden" id="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="progress-text" id="progress-text">Fetching metrics…</p>
    </div>

    <!-- Summary Cards -->
    <section class="summary-row hidden" id="summary-section">
      <div class="glass-card summary-card summary-total">
        <div class="summary-value" id="summary-total">0</div>
        <div class="summary-label">Days Requested</div>
      </div>
      <div class="glass-card summary-card summary-success">
        <div class="summary-value" id="summary-success">0</div>
        <div class="summary-label">Successful</div>
      </div>
      <div class="glass-card summary-card summary-failed">
        <div class="summary-value" id="summary-failed">0</div>
        <div class="summary-label">Failed</div>
      </div>
    </section>

    <!-- Export Buttons -->
    <section class="export-row hidden" id="export-section">
      <button class="btn btn-export btn-xlsx" id="export-xlsx-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Export All Sheets (Excel)
      </button>
      <button class="btn btn-export btn-csv" id="export-csv-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Export Current Tab (CSV)
      </button>
    </section>

    <!-- Sheet Tabs + Data Table -->
    <section class="glass-card table-card hidden" id="table-section">
      <div class="tabs-bar" id="tabs-bar">
        <!-- Tabs will be injected dynamically -->
      </div>
      <div class="table-meta">
        <span class="row-count" id="row-count"></span>
      </div>
      <div class="table-wrapper">
        <table id="data-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>

    <!-- Error Toast -->
    <div class="toast hidden" id="error-toast">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <span id="error-text"></span>
    </div>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
